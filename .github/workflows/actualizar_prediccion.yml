name: Actualizar pronostico de siniestros

on:
  schedule:
    # 10:00 UTC = 05:00 hora Colombia. Ajusta la hora si lo necesitas.
    - cron: "0 10 * * *"
  push:
    paths:
      - "data/nuevos/**"
      - "data/historico/serie_diaria_historica.csv"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas numpy statsmodels scikit-learn openpyxl

      - name: Generar el pronostico del dia
        run: python scripts/generar_pronostico.py

      - name: Archivar los archivos del dia ya procesados
        run: |
          mkdir -p data/historico/procesados
          find data/nuevos -maxdepth 1 -type f -exec mv {} data/historico/procesados/ \; 2>/dev/null || true
          git add data/historico/procesados

      - name: Publicar el resultado
        run: |
          git config user.name "bot-pronostico"
          git config user.email "actions@github.com"
          git add docs/prediccion.json data/historico/procesados
          git diff --quiet --cached || git commit -m "Actualiza pronostico $(date -u +%Y-%m-%d)"
          git push
